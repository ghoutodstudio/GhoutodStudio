<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código para insertar Imágenes de Google Drive</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-brand {
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .studio-credits {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #00c6ff;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 700;
            margin-top: 10px;
        }

        .instructions {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: #121212;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #0072ff;
            box-shadow: 0 0 12px rgba(0, 114, 255, 0.3);
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.5);
        }

        .btn-main:active {
            transform: translateY(1px);
        }

        .result-container {
            display: none;
            margin-top: 25px;
            text-align: left;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            color: #a0a0a0;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-box-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        #hiddenClipboardInput {
            position: absolute;
            left: -9999px;
            top: 0;
        }

        .code-box {
            width: 100%;
            background: #16161a;
            color: #38bdf8;
            padding: 15px 85px 15px 15px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.05);
            max-height: 120px;
            overflow-y: auto;
        }

        .btn-copy {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .preview-box {
            background: #121212;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-brand">
        <img class="brand-logo" src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <div class="studio-credits">By GhoutodStudio</div>
    </div>

    <h1>Código Embed para HTML</h1>
    <p class="instructions">Pega Tu Link Para Obtener El Código <> </p>
    
    <div class="input-group">
        <input type="text" id="driveUrl" placeholder="https://drive.google.com/file/d/.../view?usp=sharing">
    </div>
    
    <button class="btn-main" onclick="generarCodigoHTML()">Generar Código HTML</button>

    <div id="resultSection" class="result-container">
        <span class="result-label">Código Listo:</span>
        <div class="code-box-wrapper">
            <div id="htmlCodigo" class="code-box"></div>
            <textarea id="hiddenClipboardInput"></textarea>
            <button class="btn-copy" onclick="copiarCodigo()" id="btnCopyText">Copiar</button>
        </div>

        <span class="result-label">Vista Previa:</span>
        <div class="preview-box">
            <img id="resultadoImagen" src="" alt="Vista previa del archivo">
        </div>
    </div>
</div>

<script>
function generarCodigoHTML() {
    const urlInput = document.getElementById('driveUrl').value.trim();
    const resultSection = document.getElementById('resultSection');
    const imgElement = document.getElementById('resultadoImagen');
    const codeElement = document.getElementById('htmlCodigo');
    const btnCopyText = document.getElementById('btnCopyText');
    
    const regExp = /\/d\/([a-zA-Z0-9-_]+)/;
    const match = urlInput.match(regExp);

    if (match && match[1]) {
        const fileId = match[1];
        const directoUrl = `https://lh3.googleusercontent.com/d/${fileId}`;
        const htmlGenerado = `<img src="${directoUrl}" alt="Imagen desde Google Drive">`;
        
        codeElement.innerText = htmlGenerado;
        imgElement.src = directoUrl;
        
        resultSection.style.display = 'block';
        btnCopyText.innerText = "Copiar";
        btnCopyText.style.color = "#ffffff";
        btnCopyText.style.borderColor = "rgba(255, 255, 255, 0.2)";
    } else {
        alert('Por favor, introduce un enlace válido de compartir de Google Drive.');
        resultSection.style.display = 'none';
    }
}

function copiarCodigo() {
    const codeText = document.getElementById('htmlCodigo').innerText;
    const btnCopyText = document.getElementById('btnCopyText');
    const hiddenInput = document.getElementById('hiddenClipboardInput');

    hiddenInput.value = codeText;
    
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(codeText).then(() => {
            marcarComoCopiado(btnCopyText);
        }).catch(() => {
            ejecutarCopiaFallback(hiddenInput, btnCopyText);
        });
    } else {
        ejecutarCopiaFallback(hiddenInput, btnCopyText);
    }
}

function ejecutarCopiaFallback(inputElement, boton) {
    inputElement.select();
    inputElement.setSelectionRange(0, 99999); 
    try {
        document.execCommand('copy');
        marcarComoCopiado(boton);
    } catch (err) {
        alert('No se pudo copiar automáticamente. Por favor selecciona el código manualmente.');
    }
}

function marcarComoCopiado(boton) {
    boton.innerText = "¡Copiado!";
    boton.style.color = "#38bdf8";
    boton.style.borderColor = "#38bdf8";
    setTimeout(() => {
        boton.innerText = "Copiar";
        boton.style.color = "#ffffff";
        boton.style.borderColor = "rgba(255, 255, 255, 0.2)";
    }, 2000);
}
</script>

</body>
</html>
