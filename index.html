<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhoutodStudio</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #0d0d0d;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid #1a1a1a;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid #4ae051;
        }
        h1 {
            color: #ffffff;
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #4ae051;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.2s, background 0.2s;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-mcpedl {
            background-color: #5c8e32;
        }
        .btn-mcpedl:hover {
            background-color: #4b7528;
        }
        .btn-curse {
            background-color: #ff5a00;
        }
        .btn-curse:hover {
            background-color: #e04f00;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="GhoutodStudio Logo" class="logo-img">
        
        <h2>GhoutodStudio</h2>
        <h2>Creador de Addons - Minecraft Bedrock<h2>
        
        <a href="https://mcpedl.com/user/GhoutodStudio/" target="_blank" class="btn btn-mcpedl">
            Descargar en MCPEDL
        </a>

        <a href="https://www.curseforge.com/members/GhoutodStudio/projects" target="_blank" class="btn btn-curse">
            Proyectos en CurseForge
        </a>
    </div>

</body>
</html>
