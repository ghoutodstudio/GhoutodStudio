<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhoutodStudio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #11141a;
            color: #ffffff;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1b222d;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #2d3848;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #4ae051;
            border-radius: 50px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #11141a;
        }
        h1 {
            color: #ffffff;
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #4ae051;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            padding: 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.2s, background 0.2s;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-mcpedl {
            background-color: #5c8e32;
        }
        .btn-mcpedl:hover {
            background-color: #4b7528;
        }
        .btn-curse {
            background-color: #ff5a00;
        }
        .btn-curse:hover {
            background-color: #e04f00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar">G</div>
        <h1>GhoutodStudio</h1>
        <p class="subtitle">Creador de Addons - Minecraft Bedrock</p>
        
        <a href="https://mcpedl.com/user/GhoutodStudio/" target="_blank" class="btn btn-mcpedl">
            Descargar en MCPEDL
        </a>

        <a href="https://curseforge.com" target="_blank" class="btn btn-curse">
            Proyectos en CurseForge
        </a>
    </div>

</body>
</html>
